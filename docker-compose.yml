services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: delivery
      POSTGRES_USER: ${DB_USER:-delivery}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-delivery}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-delivery} -d delivery"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/delivery
      DB_USER: ${DB_USER:-delivery}
      DB_PASSWORD: ${DB_PASSWORD:-delivery}
      JWT_SECRET: ${JWT_SECRET:?Définissez JWT_SECRET dans .env (voir .env.example)}
      SEED_DATA: ${SEED_DATA:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  frontend:
    build: ./frontend
    ports:
      - "${APP_PORT:-8081}:80"
    depends_on:
      - backend

volumes:
  db-data:
