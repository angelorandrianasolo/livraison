server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # L'API est servie par le backend : le navigateur n'appelle qu'une seule origine (pas de CORS).
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /swagger-ui/ { proxy_pass http://backend:8080; }
  location /v3/api-docs { proxy_pass http://backend:8080; }

  location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Routage côté client (Angular)
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
